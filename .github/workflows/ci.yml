name: CI/CD - OS Bootstrap

on:
  push:
    branches: [ debian ]
  pull_request:
    branches: [ debian ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gdisk btrfs-progs parted dosfstools debootstrap systemd-boot qemu-system-x86-64 ovmf
        sudo mkdir -p target
        sudo touch target/dependency
    
    - name: Create loopback device
      run: |
        # Create a 10GB disk image
        sudo dd if=/dev/zero of=/tmp/disk.img bs=1M count=10240 status=progress
        
        # Setup loopback device
        sudo losetup -fP /tmp/disk.img
        export LOOP_DEVICE=$(sudo losetup -j /tmp/disk.img | cut -d: -f1)
        echo "LOOP_DEVICE=$LOOP_DEVICE" >> $GITHUB_ENV
        echo "Created loopback device: $LOOP_DEVICE"
        
        # Show device info
        sudo lsblk $LOOP_DEVICE
    
    - name: Partition and format disk
      run: |
        sudo make target/partition-disk-ci DISK=${{ env.LOOP_DEVICE }}
        sudo make target/format-ci DISK=${{ env.LOOP_DEVICE }}
    
    - name: Create subvolumes
      run: |
        sudo make target/subvolume DISK=${{ env.LOOP_DEVICE }}
    
    - name: Generate SSH key for testing
      run: |
        ssh-keygen -t ed25519 -f ~/.ssh/ci_test_key -N "" -C "ci-test@github-actions"
        echo "SSH_PUB_KEY=$HOME/.ssh/ci_test_key.pub" >> $GITHUB_ENV
        echo "SSH_KEY_PATH=$HOME/.ssh/ci_test_key" >> $GITHUB_ENV
    
    - name: Bootstrap and configure system
      run: |
        sudo make target/all-ci DISK=${{ env.LOOP_DEVICE }} SSH_PUB_KEY=${{ env.SSH_PUB_KEY }}
    
    - name: Unmount filesystems
      run: |
        sudo make util/unmount-kernelfs
        sudo make util/unmount
        sync
    
    - name: Boot with QEMU/KVM and run tests
      run: |
        # Detect OVMF firmware files
        if [ -f /usr/share/OVMF/OVMF_CODE_4M.fd ]; then
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE_4M.fd
          OVMF_VARS=/usr/share/OVMF/OVMF_VARS_4M.fd
        elif [ -f /usr/share/OVMF/OVMF_CODE.fd ]; then
          OVMF_CODE=/usr/share/OVMF/OVMF_CODE.fd
          OVMF_VARS=/usr/share/OVMF/OVMF_VARS.fd
        elif [ -f /usr/share/qemu/OVMF_CODE.fd ]; then
          OVMF_CODE=/usr/share/qemu/OVMF_CODE.fd
          OVMF_VARS=/usr/share/qemu/OVMF_VARS.fd
        else
          echo "Error: OVMF firmware files not found"
          exit 1
        fi
        
        echo "Using OVMF_CODE: $OVMF_CODE"
        echo "Using OVMF_VARS: $OVMF_VARS"
        
        # Copy OVMF variables
        mkdir -p qemu-run
        cp "$OVMF_VARS" ./qemu-run/OVMF_VARS.fd
        
        # Start QEMU in background with SSH port forwarding
        sudo qemu-system-x86_64 \
          -enable-kvm \
          -nographic \
          -m 2g \
          -smp 2 \
          -drive if=pflash,format=raw,readonly,file="$OVMF_CODE" \
          -drive if=pflash,format=raw,file=./qemu-run/OVMF_VARS.fd \
          -drive file=${{ env.LOOP_DEVICE }},format=raw,if=none,id=disk0,cache=none \
          -device virtio-blk-pci,drive=disk0 \
          -netdev user,id=net0,hostfwd=tcp::2222-:22 \
          -device virtio-net-pci,netdev=net0 \
          -boot order=c \
          -serial mon:stdio \
          > qemu-output.log 2>&1 &
        
        QEMU_PID=$!
        echo "QEMU_PID=$QEMU_PID" >> $GITHUB_ENV
        echo "QEMU started with PID: $QEMU_PID"
        
        # Wait for system to boot (cloud-init takes time)
        echo "Waiting for system to boot and cloud-init to complete..."
        sleep 120
        
        # Try to connect via SSH
        echo "Attempting SSH connection to cscg user..."
        MAX_ATTEMPTS=10
        ATTEMPT=0
        
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          if ssh -o StrictHostKeyChecking=no \
                 -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=10 \
                 -i ${{ env.SSH_KEY_PATH }} \
                 -p 2222 \
                 cscg@localhost "echo 'SSH connection successful'"; then
            echo "SSH connection established!"
            break
          fi
          
          ATTEMPT=$((ATTEMPT + 1))
          echo "Attempt $ATTEMPT failed, retrying in 15 seconds..."
          sleep 15
        done
        
        if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
          echo "Failed to establish SSH connection after $MAX_ATTEMPTS attempts"
          echo "=== QEMU Output ==="
          cat qemu-output.log
          sudo kill ${{ env.QEMU_PID }} || true
          exit 1
        fi
        
        # Run the test script
        echo "Running test script on the VM..."
        ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ${{ env.SSH_KEY_PATH }} \
            -p 2222 \
            cscg@localhost "bash /home/cscg/test-script.sh"
        
        # Shutdown the VM gracefully
        echo "Shutting down VM..."
        ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -i ${{ env.SSH_KEY_PATH }} \
            -p 2222 \
            cscg@localhost "sudo poweroff" || true
        
        # Wait for QEMU to exit
        sleep 10
        sudo kill ${{ env.QEMU_PID }} 2>/dev/null || true
        
        echo "=== Test completed successfully! ==="
    
    - name: Cleanup
      if: always()
      run: |
        # Kill QEMU process if it's still running
        if [ -n "${{ env.QEMU_PID }}" ]; then
          sudo kill ${{ env.QEMU_PID }} 2>/dev/null || true
        fi
        
        # Also check for any other QEMU processes and kill them by PID
        QEMU_PIDS=$(pgrep qemu-system-x86_64 || true)
        if [ -n "$QEMU_PIDS" ]; then
          for pid in $QEMU_PIDS; do
            sudo kill $pid 2>/dev/null || true
          done
        fi
        
        # Unmount any remaining mounts
        sudo make util/unmount-kernelfs || true
        sudo make util/unmount || true
        
        # Detach loopback device
        if [ -n "${{ env.LOOP_DEVICE }}" ]; then
          sudo losetup -d "${{ env.LOOP_DEVICE }}" || true
        fi
        
        # Remove disk image
        sudo rm -f /tmp/disk.img
        
        echo "Cleanup completed"
    
    - name: Upload QEMU output on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: qemu-output
        path: qemu-output.log
        retention-days: 7
